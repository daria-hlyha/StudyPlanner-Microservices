global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "auth-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: "study-plan-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["study-plan-service:8000"]

  - job_name: "progress-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["progress-service:8000"]
